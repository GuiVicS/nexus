# sway em modo kiosk para o Nexus. Workspace 1 = Shell · workspace 2 = jogos e apps.
# Sem barra, sem atalhos do usuário e sem decorações: o Core controla o que aparece.
default_border none
default_floating_border none
focus_follows_mouse no
mouse_warping none
floating_modifier none
xwayland enable
font pango:monospace 1
workspace_layout default
seat * hide_cursor 0

# A Shell (Electron) fica no workspace 1, sempre em tela cheia.
assign [app_id="nexus-shell"] workspace number 1
for_window [app_id="nexus-shell"] fullscreen enable, border none

# Toda outra janela (jogo, Steam, apps) vai para o workspace 2 em tela cheia.
# A Shell fica de fora pela própria regra (lookahead). Janelas X11 (XWayland, ex.: Steam e jogos Proton) por shell=xwayland:
# no sway 1.11, [class=".*"] também casa com janelas Wayland e mandava a própria Shell para o workspace 2 (tela vazia).
for_window [shell="xdg_shell" app_id="^(?!nexus-shell$)"] move to workspace number 2, fullscreen enable
for_window [shell="xwayland" class="^(?![Ss]team$)"] move to workspace number 2, fullscreen enable
# Janela nova nunca rouba a tela sozinha (o sway focaria e trocaria de workspace): o Core mostra o jogo quando
# ele já está desenhando (esconde splash/telas pretas) e volta ao Nexus quando ele fecha.
no_focus [shell="xwayland"]
no_focus [shell="xdg_shell" app_id="^(?!nexus-shell$)"]
# A Steam é só o motor: as janelas do cliente (principal, "Updating Steam", nuvem, amigos, "Install") nunca
# aparecem — vão para o scratchpad (invisível). Os jogos têm classe própria (steam_app_N ou a do jogo) e ficam no
# workspace 2. Quando precisa (ex.: confirmar "Install"), o Core traz a janela por baixo de uma capa do Nexus.
# Nada de "focus" automático: só o Core decide o que está na tela (um "focus" aqui levava a tela para a Steam).
for_window [class="^[Ss]team$"] move scratchpad
# Avisos do sistema (relatório de travamento do Ubuntu/apport) não aparecem por cima de jogos: ficam escondidos
# (o relatório continua salvo em /var/crash).
for_window [app_id="^(system-crash-notification|apport-gtk)$"] move scratchpad
for_window [class="^(Apport-gtk|apport-gtk)$"] move scratchpad
for_window [floating shell="xwayland" class="^(?![Ss]team$)"] fullscreen enable

# Menu rápido por cima do jogo/app (abre e fecha): F1 ou tecla Super. No controle: Guia ou Select+Start (Core).
bindsym F1 exec /usr/bin/nexus-core guide
bindsym --release --to-code Super_L exec /usr/bin/nexus-core guide
# Atalho de emergência: Ctrl+Alt+Home volta ao Nexus.
bindsym --to-code Ctrl+Alt+Home workspace number 1
# Troca de VT continua valendo (Ctrl+Alt+F3) — não é desativada de propósito.

output * bg #0b1012 solid_color
# Marca no fundo: é o que aparece enquanto a Shell sobe (ou reinicia), em vez de uma tela vazia.
exec sh -c 'f=${NEXUS_SPLASH:-/usr/share/nexus/splash.png}; [ -f "$f" ] && swaymsg output "*" bg "$f" fill "#0b1012"'
# Depois que o sway sobe: passa a tela Wayland ao systemd --user e inicia os serviços do Nexus.
exec sh -c 'systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK DISPLAY XDG_CURRENT_DESKTOP; dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK DISPLAY XDG_CURRENT_DESKTOP; systemctl --user reset-failed "nexus-*.service" "nexus-*.target"; systemctl --user start nexus-session.target'
