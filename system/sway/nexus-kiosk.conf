# sway em modo kiosk para o Nexus. Workspace 1 = Shell · workspace 2 = jogos e apps.
# Sem barra, sem atalhos do usuário e sem decorações: o Core controla o que aparece.
default_border none
default_floating_border none
focus_follows_mouse no
mouse_warping none
floating_modifier none
xwayland enable
font pango:monospace 1
workspace_layout default
seat * hide_cursor 0

# A Shell (Electron) fica no workspace 1, sempre em tela cheia.
assign [app_id="nexus-shell"] workspace number 1
for_window [app_id="nexus-shell"] fullscreen enable, border none

# Toda outra janela (jogo, Steam, apps) vai para o workspace 2 em tela cheia.
# A Shell fica de fora pela própria regra (lookahead). Janelas X11 (XWayland, ex.: Steam e jogos Proton) por shell=xwayland:
# no sway 1.11, [class=".*"] também casa com janelas Wayland e mandava a própria Shell para o workspace 2 (tela vazia).
for_window [shell="xdg_shell" app_id="^(?!nexus-shell$)"] move to workspace number 2, fullscreen enable
for_window [shell="xwayland"] move to workspace number 2, fullscreen enable
# Diálogos (ex.: "Install" da Steam) abrem flutuando e ficariam atrás da janela principal em tela cheia.
for_window [floating shell="xwayland"] fullscreen enable, focus

# Tecla Super (Windows) = botão Guia: abre a Central por cima do jogo. (Tab fica livre para os jogos.)
bindsym --release --to-code Super_L exec /usr/bin/nexus-core guide
# Atalho de emergência: Ctrl+Alt+Home volta ao Nexus.
bindsym --to-code Ctrl+Alt+Home workspace number 1
# Troca de VT continua valendo (Ctrl+Alt+F3) — não é desativada de propósito.

output * bg #0b1012 solid_color
# Depois que o sway sobe: passa a tela Wayland ao systemd --user e inicia os serviços do Nexus.
exec sh -c 'systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK DISPLAY XDG_CURRENT_DESKTOP; dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK DISPLAY XDG_CURRENT_DESKTOP; systemctl --user reset-failed "nexus-*.service" "nexus-*.target"; systemctl --user start nexus-session.target'
