[package]
name = "nexus-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
evdev = "0.13.2"
futures-util = "0.3.34"
keyvalues-parser = "0.2.4"
libc = "0.2.191"
nexus-protocol = { path = "../nexus-protocol" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
