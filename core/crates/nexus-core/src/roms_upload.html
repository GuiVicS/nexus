<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enviar jogos · Nexus</title>
<style>
  :root{--bg:#0b1012;--card:#141c1f;--fg:#f3faf9;--muted:#9fb3b0;--primary:#2bd4bd;--err:#fb7185;--ok:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px}
  .brand{color:var(--primary);font-weight:700;letter-spacing:.3em;font-size:13px}
  h1{font-size:26px;margin:6px 0 4px}
  p.sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:16px}
  label{display:block;font-weight:600;margin-bottom:8px}
  select,button{width:100%;font:inherit;border-radius:12px;border:1px solid #2a3a3d;background:#0f1618;color:var(--fg);padding:14px}
  button{background:var(--primary);color:#062420;border:none;font-weight:700;margin-top:14px}
  button:disabled{opacity:.45}
  .pick{display:flex;align-items:center;justify-content:center;border:2px dashed #2a3a3d;border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
  .pick input{display:none}
  ul{list-style:none;margin:12px 0 0;padding:0}
  li{padding:10px 0;border-top:1px solid #1f2a2d}
  li .n{word-break:break-all}
  li small{color:var(--muted)}
  .bar{height:6px;border-radius:6px;background:#1f2a2d;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s}
  .ok{color:var(--ok)} .err{color:var(--err)}
  .hint{font-size:14px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
  <div class="brand">NEXUS</div>
  <h1>Enviar jogos para a TV</h1>
  <p class="sub">Escolha o console e os arquivos dos jogos (ROMs). Eles aparecem na aba Emuladores assim que chegarem.</p>

  <div class="card">
    <label for="sys">Console</label>
    <select id="sys"><option value="">Detectar pelo tipo de arquivo</option></select>
    <p class="hint" id="exts"></p>
  </div>

  <div class="card">
    <label class="pick">
      <input id="files" type="file" multiple>
      <span id="pickTxt">Toque para escolher os arquivos</span>
    </label>
    <ul id="list"></ul>
    <button id="send" disabled>Enviar</button>
  </div>

<script>
  const SYSTEMS = __SYSTEMS__;
  const token = new URLSearchParams(location.search).get('t') || '';
  const sel = document.getElementById('sys');
  const files = document.getElementById('files');
  const list = document.getElementById('list');
  const send = document.getElementById('send');
  for (const s of SYSTEMS) {
    const o = document.createElement('option');
    o.value = s.dir; o.textContent = s.name; sel.appendChild(o);
  }
  sel.onchange = () => {
    const s = SYSTEMS.find((x) => x.dir === sel.value);
    document.getElementById('exts').textContent = s ? 'Arquivos aceitos: .' + s.exts.join(' .') + ' .zip .7z' : '';
    render();
  };
  const ext = (n) => (n.split('.').pop() || '').toLowerCase();
  // console pelo tipo de arquivo, quando só um console usa aquela extensão
  const guess = (n) => {
    const m = SYSTEMS.filter((s) => s.exts.includes(ext(n)));
    return m.length === 1 ? m[0].dir : '';
  };
  const target = (f) => sel.value || guess(f.name);
  const fmt = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
  let rows = [];
  function render() {
    list.innerHTML = '';
    rows = [...files.files].map((f) => {
      const li = document.createElement('li');
      const sys = target(f);
      const name = SYSTEMS.find((s) => s.dir === sys)?.name;
      li.innerHTML = '<div class="n"></div><small></small><div class="bar"><i></i></div>';
      li.querySelector('.n').textContent = f.name;
      li.querySelector('small').textContent = fmt(f.size) + ' · ' + (name || 'escolha o console acima');
      if (!name) li.querySelector('small').className = 'err';
      list.appendChild(li);
      return { f, li, sys };
    });
    document.getElementById('pickTxt').textContent = rows.length ? rows.length + (rows.length === 1 ? ' arquivo escolhido' : ' arquivos escolhidos') : 'Toque para escolher os arquivos';
    send.disabled = !rows.length || rows.some((r) => !r.sys);
  }
  files.onchange = render;
  function upload(r) {
    return new Promise((done) => {
      const x = new XMLHttpRequest();
      x.open('POST', '/remote/upload?t=' + encodeURIComponent(token) + '&system=' + encodeURIComponent(r.sys) + '&name=' + encodeURIComponent(r.f.name));
      const bar = r.li.querySelector('.bar i');
      const msg = r.li.querySelector('small');
      x.upload.onprogress = (e) => { if (e.lengthComputable) bar.style.width = (100 * e.loaded / e.total).toFixed(1) + '%'; };
      x.onload = () => {
        let j = {};
        try { j = JSON.parse(x.responseText); } catch (_) {}
        if (x.status === 200 && j.ok) { bar.style.width = '100%'; msg.textContent = 'Enviado ✓'; msg.className = 'ok'; }
        else { msg.textContent = j.error || 'Não foi possível enviar'; msg.className = 'err'; }
        done();
      };
      x.onerror = () => { msg.textContent = 'Sem conexão com a TV (mesma rede Wi-Fi?)'; msg.className = 'err'; done(); };
      x.send(r.f);
    });
  }
  let sent = false;
  send.onclick = async () => {
    if (sent) { // "Enviar mais": limpa a lista e abre a escolha de arquivos de novo
      sent = false; files.value = ''; render(); send.textContent = 'Enviar'; files.click();
      return;
    }
    send.disabled = true; files.disabled = true; sel.disabled = true;
    for (const r of rows) await upload(r);
    files.disabled = false; sel.disabled = false;
    sent = true;
    send.textContent = 'Enviar mais';
    send.disabled = false;
  };
</script>
</body>
</html>
